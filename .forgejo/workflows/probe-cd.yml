name: Probe CD
# Sonde TEMPORAIRE, a supprimer une fois la reponse obtenue.
#
# But : prouver par une execution reelle que le mecanisme de deploiement continu
# mono-hote est praticable. Le journal des jobs n'est pas exposé par l'API de cette
# version du serveur : la reponse est donc portee par le STATUT du job. Vert = les
# trois conditions sont reunies. Rouge = l'une d'elles manque, et l'etape qui echoue
# dit laquelle.
#
# Les trois conditions du deploiement mono-hote :
#   1. le job atteint le demon Docker de l'hote ;
#   2. il peut lancer un conteneur frere qui monte le repertoire de deploiement
#      AU MEME CHEMIN (les montages de docker-compose.prod.yml sont relatifs :
#      montes ailleurs, ils pointeraient a cote) ;
#   3. le fichier compose de production, hors depot, est bien la.
#
# Tout est en lecture seule : aucune image reconstruite, aucun conteneur recree.

on:
  push:
    branches: ['ci/**']

env:
  DEPLOY_PATH: /home/acadenice/corentin_wakdo

jobs:
  probe:
    runs-on: docker
    steps:
      - name: Installer le client Docker
        run: |
          set -eu
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker
          docker --version

      - name: Condition 1 - le demon Docker de l hote repond
        run: docker version --format 'serveur {{.Server.Version}}'

      - name: Condition 2+3 - conteneur frere, meme chemin, compose present
        run: |
          set -eu
          docker run --rm \
            -v "$DEPLOY_PATH:$DEPLOY_PATH" \
            -w "$DEPLOY_PATH" \
            alpine:3 \
            sh -c 'test -f docker-compose.prod.yml && test -d src && test -d db && echo "chemin de deploiement conforme"'
