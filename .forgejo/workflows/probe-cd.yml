name: Probe CD
# Sonde TEMPORAIRE, a supprimer une fois la reponse obtenue.
# Le journal des jobs n'est pas expose par l'API de cette version du serveur :
# la reponse est donc portee par le STATUT de chaque job. Un job par condition,
# independants, pour que le NOM du job rouge designe exactement ce qui manque.

on:
  push:
    branches: ['ci/**']

env:
  DEPLOY_PATH: /home/acadenice/corentin_wakdo

jobs:
  c1-telechargement-client:
    runs-on: docker
    steps:
      - name: Recuperer le client Docker
        run: |
          set -eu
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker
          docker --version

  c2-socket-present:
    runs-on: docker
    steps:
      - name: Le socket Docker de l hote est-il monte dans le job
        run: test -S /var/run/docker.sock

  c3-demon-repond:
    runs-on: docker
    steps:
      - name: Interroger le demon sans client, par le socket
        run: |
          set -eu
          curl -sf --unix-socket /var/run/docker.sock http://localhost/version >/dev/null
          echo "le demon repond"

  c4-conteneur-frere-meme-chemin:
    runs-on: docker
    steps:
      - name: Lancer un conteneur frere montant le repertoire de deploiement
        run: |
          set -eu
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz \
            | tar xz --strip-components=1 -C /usr/local/bin docker/docker
          docker run --rm \
            -v "$DEPLOY_PATH:$DEPLOY_PATH" \
            -w "$DEPLOY_PATH" \
            alpine:3 \
            sh -c 'test -f docker-compose.prod.yml && test -d src && test -d db && echo conforme'
