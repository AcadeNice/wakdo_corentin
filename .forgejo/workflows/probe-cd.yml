name: Probe CD
# Sonde TEMPORAIRE, a supprimer une fois la reponse obtenue.
# Le journal des jobs n'est pas expose par l'API : la reponse est portee par le
# STATUT de chaque job.
#
# Question : un conteneur de job peut-il joindre l'hote sur le port SSH ? C'est
# la seule inconnue du deploiement continu retenu. Aucune connexion n'est
# etablie, aucune cle n'est utilisee : on ouvre un socket TCP et on le referme.
#
# La version precedente echouait sur strtonum(), absent de l'awk de l'image de
# job. On installe iproute2 et on lit la route par defaut, ce qui ne depend
# d'aucune extension.

on:
  push:
    branches: ['ci/**']

jobs:
  e1-determiner-l-adresse-de-l-hote:
    runs-on: docker
    steps:
      - name: Lire la route par defaut
        run: |
          set -eu
          apt-get update -qq >/dev/null
          apt-get install -y -qq iproute2 >/dev/null
          GW=$(ip route show default | awk '/default/ {print $3; exit}')
          test -n "$GW"
          echo "l hote est vu a l adresse $GW"

  e2-joindre-le-port-ssh-de-l-hote:
    runs-on: docker
    steps:
      - name: Ouvrir un socket TCP vers le port 22 de l hote
        run: |
          set -eu
          apt-get update -qq >/dev/null
          apt-get install -y -qq iproute2 >/dev/null
          GW=$(ip route show default | awk '/default/ {print $3; exit}')
          echo "tentative vers $GW:22"
          # Un serveur SSH annonce sa banniere des l ouverture : la lire prouve
          # que le port est joignable ET que c est bien SSH en face.
          timeout 8 bash -c "exec 3<>/dev/tcp/$GW/22 && head -c 20 <&3"
