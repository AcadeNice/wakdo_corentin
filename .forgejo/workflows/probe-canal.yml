name: Probe canal
# Sonde TEMPORAIRE, a supprimer une fois la reponse obtenue.
# Le deploiement lance a la main depuis l'hote FONCTIONNE (commit 01adc9a servi
# en ligne). Le meme canal echoue depuis un job. La cle est bonne (le job
# cle-de-deploiement est vert) et DEPLOY_USER vaut bien corentin. Restent deux
# hypotheses, testees ici separement, le nom du job rouge donnant la reponse.

on:
  push:
    branches: ['ci/**']

jobs:
  p1-la-cle-d-hote-est-elle-acceptee:
    runs-on: docker
    steps:
      - name: Verifier UNIQUEMENT la cle d hote, sans authentification
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          apt-get update -qq >/dev/null
          apt-get install -y -qq openssh-client iproute2 >/dev/null
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          HOTE="$(ip route show default | awk '/default/ {print $3; exit}')"
          echo "hote vu depuis le job : $HOTE"
          set +e
          SORTIE=$(ssh -o StrictHostKeyChecking=yes -o BatchMode=yes \
                       -o PreferredAuthentications=none -o ConnectTimeout=10 \
                       "corentin@$HOTE" 2>&1)
          set -e
          echo "$SORTIE"
          # "Permission denied" = la cle d'hote a ete acceptee, seule l'authentification
          # a ete refusee (c'est attendu : on a desactive toute methode).
          if echo "$SORTIE" | grep -q "Permission denied"; then
            echo "la cle d hote est acceptee"; exit 0
          fi
          echo "la cle d hote est REFUSEE ou l hote est injoignable" >&2
          exit 1

  p2-l-authentification-passe-t-elle:
    runs-on: docker
    steps:
      - name: Tenter l authentification sans laisser la commande s executer
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -eu
          apt-get update -qq >/dev/null
          apt-get install -y -qq openssh-client iproute2 >/dev/null
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          HOTE="$(ip route show default | awk '/default/ {print $3; exit}')"
          echo "utilisateur cible : ${DEPLOY_USER:-VIDE} sur $HOTE"
          test -n "${DEPLOY_USER:-}"
          set +e
          # -O check interroge la connexion sans ouvrir de session : l'authentification
          # a lieu, mais la commande forcee ne s'execute pas. On evite ainsi de
          # declencher un deploiement depuis une sonde.
          SORTIE=$(ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
                       -o StrictHostKeyChecking=yes -o BatchMode=yes \
                       -o ConnectTimeout=15 -o SessionType=none \
                       "$DEPLOY_USER@$HOTE" 2>&1)
          CODE=$?
          set -e
          echo "sortie ssh (code $CODE) : $SORTIE"
          if [ "$CODE" -eq 0 ]; then echo "authentification acceptee"; exit 0; fi
          echo "authentification REFUSEE" >&2
          exit 1
