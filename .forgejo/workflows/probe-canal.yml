name: Probe canal
# Sonde TEMPORAIRE. La route par defaut du conteneur de job ne mene PAS a stark :
# il faut donc une adresse explicite. Deux candidates, un job chacune, le vert
# designe celle a retenir. On compare la cle d'hote presentee a celle de stark.

on:
  push:
    branches: ['ci/**']

env:
  CLE_HOTE_ATTENDUE: "AAAAC3NzaC1lZDI1NTE5AAAAIExEMKL3ZKHil4u3+9r9LXTElp8hjHisHDXb/zQD8kCb"

jobs:
  h1-adresse-reseau-des-jobs-10-44-0-1:
    runs-on: docker
    steps:
      - name: stark repond-il en SSH sur sa patte du reseau des jobs
        run: |
          set -eu
          apt-get update -qq >/dev/null
          apt-get install -y -qq openssh-client >/dev/null
          VUE="$(ssh-keyscan -t ed25519 -T 8 10.44.0.1 2>/dev/null | awk '{print $3}' | head -1)"
          echo "cle vue : ${VUE:-AUCUNE}"
          test "$VUE" = "$CLE_HOTE_ATTENDUE"

  h2-adresse-principale-62-210-93-152:
    runs-on: docker
    steps:
      - name: stark repond-il en SSH sur son adresse principale
        run: |
          set -eu
          apt-get update -qq >/dev/null
          apt-get install -y -qq openssh-client >/dev/null
          VUE="$(ssh-keyscan -t ed25519 -T 8 62.210.93.152 2>/dev/null | awk '{print $3}' | head -1)"
          echo "cle vue : ${VUE:-AUCUNE}"
          test "$VUE" = "$CLE_HOTE_ATTENDUE"

  h3-quelle-est-la-passerelle-reelle:
    runs-on: docker
    steps:
      - name: La passerelle du job est-elle sur le reseau 10.44.0.0/24
        run: |
          set -eu
          apt-get update -qq >/dev/null
          apt-get install -y -qq iproute2 >/dev/null
          GW="$(ip route show default | awk '/default/ {print $3; exit}')"
          echo "passerelle = $GW"
          case "$GW" in 10.44.0.*) exit 0 ;; *) exit 1 ;; esac
