name: Probe canal
# Sonde TEMPORAIRE. Trois questions booleennes : le nom du job rouge repond.
# Contexte : la cle d'hote de stark est identique depuis localhost, 127.0.0.1 et
# 172.17.0.1, et un seul serveur SSH ecoute. L'epinglage est donc juste cote hote,
# mais un job le refuse. On cherche ou est le desaccord.

on:
  push:
    branches: ['ci/**']

env:
  CLE_HOTE_ATTENDUE: "AAAAC3NzaC1lZDI1NTE5AAAAIExEMKL3ZKHil4u3+9r9LXTElp8hjHisHDXb/zQD8kCb"

jobs:
  g1-la-passerelle-est-bien-l-hote:
    runs-on: docker
    steps:
      - name: La route par defaut mene-t-elle a 172.17.0.1
        run: |
          set -eu
          apt-get update -qq >/dev/null
          apt-get install -y -qq iproute2 >/dev/null
          GW="$(ip route show default | awk '/default/ {print $3; exit}')"
          echo "passerelle = $GW"
          test "$GW" = "172.17.0.1"

  g2-la-machine-jointe-presente-la-bonne-cle:
    runs-on: docker
    steps:
      - name: Relever la cle d hote depuis le job et la comparer
        run: |
          set -eu
          apt-get update -qq >/dev/null
          apt-get install -y -qq openssh-client iproute2 >/dev/null
          GW="$(ip route show default | awk '/default/ {print $3; exit}')"
          VUE="$(ssh-keyscan -t ed25519 -T 8 "$GW" 2>/dev/null | awk '{print $3}' | head -1)"
          echo "vue depuis le job : ${VUE:-AUCUNE}"
          test "$VUE" = "$CLE_HOTE_ATTENDUE"

  g3-le-secret-contient-la-bonne-cle-d-hote:
    runs-on: docker
    steps:
      - name: Comparer le secret a la cle attendue
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          DANS_SECRET="$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | awk '{print $3}' | head -1)"
          echo "longueur du secret : $(printf '%s' "$DEPLOY_KNOWN_HOSTS" | wc -c) caracteres"
          echo "motif d hote declare : $(printf '%s' "$DEPLOY_KNOWN_HOSTS" | awk '{print $1}' | head -1)"
          test "$DANS_SECRET" = "$CLE_HOTE_ATTENDUE"
