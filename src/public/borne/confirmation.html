<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <!-- Titre et description uniques et mesures (Cr 1.e.5) : voir index.html. -->
    <meta name="description" content="Votre commande Wakdo est enregistrée et part en préparation. Retrouvez votre numéro de commande, le montant réglé et le temps d'attente estimé.">
    <title>Commande Wakdo confirmée : votre numéro de retrait</title>
    <link rel="canonical" href="https://corentin-wakdo.stark.a3n.fr/confirmation.html">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- schema.org (Cr 1.e.3) : page de confirmation du site decrit sur index.html. -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "@id": "https://corentin-wakdo.stark.a3n.fr/confirmation.html#page",
        "url": "https://corentin-wakdo.stark.a3n.fr/confirmation.html",
        "name": "Confirmation de commande",
        "inLanguage": "fr-FR",
        "isPartOf": { "@id": "https://corentin-wakdo.stark.a3n.fr/#site" }
    }
    </script>
</head>
<body class="confirmation-page">

    <!-- Lien d'evitement (RGAA Cr 1.e.11) : premier element focalisable de l'ecran. -->
    <a class="skip-link" href="#main-content" title="Aller au contenu principal">Aller au contenu</a>

    <!--
        confirmation.html — Order confirmed screen.
        Numero affiche : celui renvoye par l'API a la creation de la commande
        (order_number, K + id), transmis par l'ecran de paiement ; repli local en
        visite directe. Le panier est vide au chargement par page-confirmation.js.
    -->

    <header class="site-header site-header--minimal">
        <img
            class="site-header__logo"
            src="assets/images/ui/logo.png"
            alt="Wakdo"
        >
    </header>

    <main class="confirmation-main" id="main-content" aria-label="Confirmation de commande">

        <div class="confirmation-banner" role="status" aria-live="polite">

            <!-- Checkmark SVG (inline, no external dependency) -->
            <svg class="confirmation-banner__check" viewBox="0 0 80 80" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
                <circle cx="40" cy="40" r="38" fill="#FFC72C"/>
                <polyline points="22,40 34,54 58,28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <h1 class="confirmation-banner__title">Commande confirmée&nbsp;!</h1>

            <!-- Etat de la commande et informations de retrait en exergue (Cr 1.e.2). -->
            <p class="confirmation-banner__sub">Votre commande est <em>en préparation</em></p>

            <div class="confirmation-banner__number-block">
                <span class="confirmation-banner__number-label">Votre numéro de commande</span>
                <strong class="confirmation-banner__number" id="order-number">—</strong>
            </div>

            <p class="confirmation-banner__total">
                Montant réglé&nbsp;: <strong id="order-total">—</strong>
            </p>

            <p class="confirmation-banner__delay">
                Temps d'attente estimé&nbsp;: <strong>5 à 10 minutes</strong>
            </p>

        </div>

        <button
            id="new-order-btn"
            class="btn btn--primary btn--large confirmation-new-order"
            type="button"
            aria-label="Démarrer une nouvelle commande"
        >
            Nouvelle commande
        </button>

    </main>

    <script type="module" src="assets/js/page-confirmation.js"></script>
    <script type="module" src="assets/js/a11y.js"></script>
</body>
</html>
