<!DOCTYPE html><html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <!-- Titre et description uniques et mesures (Cr 1.e.5) : voir index.html. -->
    <meta name="description" content="Parcourez la carte Wakdo par catégorie : menus, burgers, boissons, desserts et sauces. Touchez une catégorie pour afficher ses produits et leurs prix.">
    <title>Carte Wakdo : choisissez une catégorie de produits</title>
    <link rel="canonical" href="https://corentin-wakdo.stark.a3n.fr/categories.html">
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- schema.org (Cr 1.e.3) : la carte de l'etablissement, reliee depuis index.html
         par FastFoodRestaurant.hasMenu (meme @id). -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Menu",
        "@id": "https://corentin-wakdo.stark.a3n.fr/categories.html#carte",
        "name": "Carte Wakdo",
        "url": "https://corentin-wakdo.stark.a3n.fr/categories.html",
        "inLanguage": "fr-FR",
        "description": "Menus, burgers, boissons, desserts et sauces, classés par catégorie."
    }
    </script>
</head>
<body class="categories-page">

    <!-- Lien d'evitement (RGAA Cr 1.e.11) : premier element focalisable de l'ecran. -->
    <a class="skip-link" href="#main-content" title="Aller au contenu principal">Aller au contenu</a>

    <!--
        Ecran categories. La grille est peuplee par page-categories.js depuis
        GET /api/categories : seules les categories actives s'affichent, dans l'ordre
        defini en back-office. Avant, cette liste etait codee en dur (9 cartes) et
        une categorie desactivee, renommee ou ajoutee restait fausse sur cet ecran.
        Les cartes restent des liens natifs : focus et clavier inchanges apres rendu.
    -->

    <header class="site-header">
        <a href="index.html" id="back-to-welcome" class="site-header__back" aria-label="Retour à l'accueil" title="Retour à l'accueil">
            ← Retour
        </a>
        <img class="site-header__logo" src="assets/images/ui/logo.png" alt="Wakdo">
        <!--
            Empty div keeps the logo centered via space-between.
            When the cart icon is added in P5, it replaces this placeholder.
        -->
        <div class="site-header__spacer" aria-hidden="true"></div>
    </header>

    <main class="categories-main" id="main-content" aria-label="Catégories de produits">
        <h1 class="categories-main__heading">Que souhaitez-vous commander&nbsp;?</h1>
        <!-- La consigne de l'ecran, mise en exergue (Cr 1.e.2). -->
        <p class="categories-main__sub">Choisissez <strong>une catégorie</strong> pour découvrir nos produits</p>

        <!--
            Deux etats distincts a l'ecran : erreur de chargement (l'API ne repond pas)
            et catalogue vide (aucune categorie active). Les confondre ferait croire a
            une erreur de saisie sur une panne. Hors de la grille pour ne pas devenir
            une cellule desalignee.
        -->
        <p id="categories-error" class="products-error" hidden="" role="alert"></p>
        <p id="categories-empty" class="products-empty" hidden="">Aucune catégorie disponible pour le moment.</p>

        <!-- Cartes injectees par page-categories.js depuis GET /api/categories -->
        <nav id="category-grid" class="category-grid" aria-label="Navigation par catégorie">
        <a class="category-card" href="products.html?category=1" aria-label="Voir les Menus" title="Voir les Menus">
            <img class="category-card__image" src="assets/images/categories/menus.png" alt="Menus" decoding="async" data-fallback="logo" data-fallback-alt="Image non disponible">
            <span class="category-card__label">Menus</span>
        </a>
        <a class="category-card" href="products.html?category=2" aria-label="Voir les Boissons" title="Voir les Boissons">
            <img class="category-card__image" src="assets/images/categories/boissons.png" alt="Boissons" decoding="async" data-fallback="logo" data-fallback-alt="Image non disponible">
            <span class="category-card__label">Boissons</span>
        </a>
        <a class="category-card" href="products.html?category=3" aria-label="Voir les Burgers" title="Voir les Burgers">
            <img class="category-card__image" src="assets/images/categories/burgers.png" alt="Burgers" decoding="async" data-fallback="logo" data-fallback-alt="Image non disponible">
            <span class="category-card__label">Burgers</span>
        </a>
        <a class="category-card" href="products.html?category=4" aria-label="Voir les Frites" title="Voir les Frites">
            <img class="category-card__image" src="assets/images/categories/frites.png" alt="Frites" decoding="async" data-fallback="logo" data-fallback-alt="Image non disponible">
            <span class="category-card__label">Frites</span>
        </a>
        <a class="category-card" href="products.html?category=5" aria-label="Voir les Encas" title="Voir les Encas">
            <img class="category-card__image" src="assets/images/categories/encas.png" alt="Encas" decoding="async" data-fallback="logo" data-fallback-alt="Image non disponible">
            <span class="category-card__label">Encas</span>
        </a>
        <a class="category-card" href="products.html?category=6" aria-label="Voir les Wraps" title="Voir les Wraps">
            <img class="category-card__image" src="assets/images/categories/wraps.png" alt="Wraps" decoding="async" data-fallback="logo" data-fallback-alt="Image non disponible">
            <span class="category-card__label">Wraps</span>
        </a>
        <a class="category-card" href="products.html?category=7" aria-label="Voir les Salades" title="Voir les Salades">
            <img class="category-card__image" src="assets/images/categories/salades.png" alt="Salades" decoding="async" data-fallback="logo" data-fallback-alt="Image non disponible">
            <span class="category-card__label">Salades</span>
        </a>
        <a class="category-card" href="products.html?category=8" aria-label="Voir les Desserts" title="Voir les Desserts">
            <img class="category-card__image" src="assets/images/categories/desserts.png" alt="Desserts" decoding="async" data-fallback="logo" data-fallback-alt="Image non disponible">
            <span class="category-card__label">Desserts</span>
        </a>
        <a class="category-card" href="products.html?category=9" aria-label="Voir les Sauces" title="Voir les Sauces">
            <img class="category-card__image" src="assets/images/categories/sauces.png" alt="Sauces" decoding="async" data-fallback="logo" data-fallback-alt="Image non disponible">
            <span class="category-card__label">Sauces</span>
        </a></nav>
    </main>

    <!-- nav.js : persiste le mode de consommation recu en ?mode= depuis l'accueil
         (syncModeFromURL) AVANT que l'utilisateur ne suive une carte vers products.html.
         Sans ce script, le mode n'atteint jamais localStorage et le paiement part en
         service_mode null (422). C'est la 1re page post-accueil, elle doit donc le charger. -->
    <script type="module" src="assets/js/nav.js"></script>
    <script type="module" src="assets/js/page-categories.js"></script>
    <!-- abandon-guard.js (via ce point d'entree externe : la CSP script-src 'self'
         de la borne refuse tout script en ligne) : seule page ou "Retour" quitte
         reellement le parcours (categories -> accueil) ; demande confirmation si
         le panier n'est pas vide. -->
    <script type="module" src="assets/js/page-categories-leave-guard.js"></script>
    <script type="module" src="assets/js/a11y.js"></script>


<button type="button" class="a11y-toggle" data-a11y-dys-toggle="" aria-pressed="false" aria-label="Police adaptée aux personnes dyslexiques"><span class="a11y-toggle__icon" aria-hidden="true">Aa</span><span class="a11y-toggle__label">Police adaptée</span></button></body></html>
