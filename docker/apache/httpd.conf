#
# Wakdo - configuration Apache httpd 2.4 (main)
#
# Derivee de la conf par defaut fournie par httpd:2.4-alpine, adaptee au
# projet : on active les modules necessaires, on pointe les vhosts Wakdo,
# on desactive les defaults indesirables.
#

ServerRoot "/usr/local/apache2"
Listen 80

# === Modules charges ===
# Core :
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule deflate_module modules/mod_deflate.so

# Reverse proxy FastCGI vers PHP-FPM (le coeur de notre setup) :
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

# === Identite du serveur ===
# User/Group : utilisateur par defaut de l'image httpd:2.4-alpine.
# Ne lit pas le code PHP (PHP-FPM s'en charge dans son propre conteneur).
User daemon
Group daemon

# Masquer la version Apache dans les headers et les pages d'erreur.
# Defense en profondeur : en cas de breach, un attaquant doit faire du work
# pour identifier la version exacte.
ServerTokens Prod
ServerSignature Off

# Methode TRACE desactivee : par defaut (On), Apache repond 200 et renvoie la
# requete recue en echo (en-tetes compris). Un navigateur moderne interdit TRACE
# depuis une page, mais rien ne justifie de laisser ce risque (Cross-Site
# Tracing) ouvert cote serveur : ni la borne ni le back-office n'en ont l'usage.
TraceEnable Off

# ServerName par defaut evite le warning "Could not reliably determine
# the server's fully qualified domain name". Les vrais hostnames sont
# dans les vhosts.
ServerName wakdo-web

# === Limites et timeouts (defense anti-slowloris) ===
Timeout 30
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500

# === Types MIME ===
TypesConfig conf/mime.types

# === Logs ===
# stderr du conteneur = agregation par docker logs (Cr 7.d.1 observabilite).
ErrorLog /proc/self/fd/2
LogLevel warn

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%h %l %u %t \"%r\" %>s %b" common
# D-7 (contre-audit 30/09) : variante SANS la chaine de requete, pour les
# routes qui recoivent un secret dans l'URL (ex. GET /reset_password?token=...,
# PasswordResetService::requestReset()). %r journalise la ligne de requete
# COMPLETE (methode + URI + version HTTP), query string comprise -- cette
# variante la reconstruit a partir de la methode (%m), du CHEMIN SEUL (%U, sans
# query string) et de la version HTTP (%H), pour garder une trace de l'acces
# (IP, methode, chemin, statut, taille, user-agent) sans le secret. Utilisee
# par le vhost admin (wakdo-vhost.conf) via SetEnvIf, uniquement pour
# /reset_password.
#
# D-7.a (revue adverse) : PAS de %{Referer}i ici, contrairement a "combined" --
# Referrer-Policy "no-referrer" (posee cote PHP pour cette route,
# PasswordResetController::renderConfirm()) devrait deja empecher le
# navigateur d'envoyer ce champ, mais un client qui ignorerait la politique
# enverrait quand meme un Referer portant le jeton ; l'omettre ICI ferme ce
# cas en defense en profondeur, sans perte d'information puisque cette route
# n'a qu'une seule origine possible (le formulaire de /reset_password
# lui-meme).
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{User-Agent}i\"" combined_no_query
CustomLog /proc/self/fd/1 combined

# === Securite des headers par defaut (les vhosts peuvent surcharger) ===
# Pose une seule fois ici : Apache merge les headers du serveur principal avec
# ceux de chaque <VirtualHost>, donc borne ET back-office la recoivent sans
# duplication (meme mecanique deja en place pour X-Content-Type-Options
# ci-dessous). Referrer-Policy n'est PAS posee ici : le back-office (admin,
# wakdo-vhost.conf) doit la poser conditionnellement pour laisser
# `PasswordResetController::renderConfirm()` l'emporter sur /reset_password
# (D-7.b), ce que "Header ... expr=" ne peut faire qu'au niveau du vhost qui
# porte la route -- chaque vhost la pose donc lui-meme (borne : valeur fixe ;
# admin : valeur par defaut SEULEMENT si l'application n'en a pas deja pose
# une, cf. wakdo-vhost.conf).
#
# Permissions-Policy : aucun des deux fronts (borne, back-office) n'utilise
# camera, micro, geolocalisation, paiement navigateur, capteurs ou peripheriques
# USB/MIDI/Bluetooth (verifie : aucun appel a getUserMedia/geolocation/
# PaymentRequest/navigator.usb-bluetooth-midi dans src/public). Le back-office
# utilise navigator.clipboard.writeText (health.js, bouton copier) : cette
# directive n'est volontairement pas listee ici, elle garde son autorisation
# par defaut ('self'), same-origin.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=(), ambient-light-sensor=(), display-capture=(), screen-wake-lock=(), picture-in-picture=(), fullscreen=(), autoplay=(), encrypted-media=(), xr-spatial-tracking=(), web-share=(), publickey-credentials-get=(), sync-xhr=()"
    Header unset Server
</IfModule>

# === MPM event (tuning workers) ===
Include conf/extra/wakdo-mpm.conf

# === Configuration root globale (refus par defaut) ===
# Refuse tout acces hors des <Directory> explicitement autorises dans le vhost.
<Directory />
    AllowOverride none
    Require all denied
</Directory>

# === Vhosts du projet ===
# Kiosk (borne, sert du statique + relaye les API calls) et admin (back-office).
Include conf/extra/wakdo-vhost.conf
