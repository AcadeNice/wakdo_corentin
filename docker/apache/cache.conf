#
# Wakdo - politique de cache navigateur (incluse par LES DEUX vhosts)
#
# LE DEFAUT CORRIGE. Aucun en-tete Cache-Control n'etait pose sur les fichiers
# statiques. Sans cet en-tete, un navigateur applique une "fraicheur heuristique"
# (couramment un dixieme de l'age du document, RFC 9111 section 4.2.2) : un
# fichier charge la veille d'une mise en production est considere frais plusieurs
# heures apres, et reutilise SANS revalidation. Apres la refonte du back-office,
# un navigateur pouvait donc executer l'ancien JavaScript contre le nouveau HTML :
# les boutons ne faisaient rien, sans erreur visible. ETag et Last-Modified etaient
# bien presents, mais un navigateur ne les utilise que s'il decide de revalider --
# ce que la fraicheur heuristique lui evitait justement de faire.
#
# LA POLITIQUE, EN UNE PHRASE : une adresse qui change a chaque version peut etre
# gardee tres longtemps ; une adresse fixe doit etre revalidee.
#
#   +-----------------------------+--------------------------------------------+
#   | Adresse avec marqueur ?v=   | public, max-age=31536000, immutable        |
#   | Adresse fixe (code)         | no-cache (revalidation, 304 si inchange)   |
#   | Adresse fixe (media/police) | public, max-age=604800 (inchange)          |
#   | Document HTML / PHP         | no-cache / no-store                        |
#   +-----------------------------+--------------------------------------------+
#
# Le marqueur ?v=... est pose par App\Core\Asset, appele par les vues du
# back-office. La borne (public/borne) est du HTML statique servi tel quel par
# Apache : ses adresses ne peuvent pas porter de marqueur sans etape de
# construction, elle retombe donc sur la revalidation -- correct, juste moins
# econome en allers-retours.
#
# mod_expires n'est pas charge (httpd.conf) : tout passe par mod_headers, deja
# present et deja utilise par les deux vhosts.

<IfModule mod_headers.c>

    # === Documents : jamais reutilises sans revalidation ===
    # Leur adresse est stable par nature (on ne versionne pas /admin/products),
    # donc la seule garantie est l'aller-retour. no-cache n'interdit pas de
    # stocker, il impose de revalider : l'ETag rend la reponse vide (304) quand
    # rien n'a bouge. C'est ce qui garantit que le HTML servi est toujours celui
    # qui correspond au code deploye.
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>

    # Pages du back-office et reponses JSON de l'API : produites par index.php,
    # liees a la session de l'utilisateur. Aucun stockage, ni navigateur ni
    # intermediaire (PHP pose deja l'equivalent via son limiteur de cache de
    # session ; on l'ecrit ici pour que la politique soit lisible en un endroit
    # et ne depende pas d'un effet de bord de session_start()).
    <FilesMatch "\.php$">
        Header always set Cache-Control "no-store, private"
    </FilesMatch>

    # === Code (CSS / JS) : c'est lui qui doit correspondre au HTML servi ===
    # Avec marqueur, l'adresse change a chaque deploiement : le fichier garde
    # devient inatteignable, on peut donc le declarer immuable pour un an.
    # Sans marqueur (borne), on revalide a chaque fois.
    <FilesMatch "\.(css|js|mjs)$">
        Header always set Cache-Control "public, max-age=31536000, immutable" "expr=%{QUERY_STRING} =~ /(^|&)v=[A-Za-z0-9._-]+/"
        Header always set Cache-Control "no-cache" "expr=!(%{QUERY_STRING} =~ /(^|&)v=[A-Za-z0-9._-]+/)"
    </FilesMatch>

    # === Media et polices : pas de couplage avec le HTML ===
    # Une image ou une police obsolete s'affiche, elle ne casse pas une page. On
    # garde donc la semaine deja en place quand l'adresse est fixe (la borne
    # charge des dizaines d'images par ecran : la faire revalider a chaque fois
    # couterait des allers-retours sans rien corriger), et on passe a un an des
    # que l'adresse porte un marqueur.
    <FilesMatch "\.(jpe?g|png|gif|ico|svg|webp|woff2?|avif)$">
        Header always set Cache-Control "public, max-age=31536000, immutable" "expr=%{QUERY_STRING} =~ /(^|&)v=[A-Za-z0-9._-]+/"
        Header always set Cache-Control "public, max-age=604800" "expr=!(%{QUERY_STRING} =~ /(^|&)v=[A-Za-z0-9._-]+/)"
    </FilesMatch>

</IfModule>
