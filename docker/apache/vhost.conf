#
# Wakdo - vhosts applicatifs
#
# Un seul conteneur Apache derriere Traefik sert **les deux** FQDN :
#   - APP_HOST_KIOSK  -> /var/www/html/public/borne   (borne client, Bloc 1)
#   - APP_HOST_ADMIN  -> /var/www/html/public/admin   (back-office + API, Bloc 2)
#
# Comme Traefik termine TLS en amont et communique en HTTP clair avec Apache
# sur le reseau docker, les vhosts ecoutent sur :80 et font confiance aux
# headers X-Forwarded-* fournis par Traefik.
#
# Le SetHandler "proxy:fcgi://wakdo-app:9000" est le coeur du reverse FastCGI :
# toute requete *.php est relayee au pool PHP-FPM via TCP sur le reseau interne
# wakdo_internal. wakdo-app n'est JAMAIS joignable directement depuis l'exterieur.
#

# === Healthcheck interne Docker (non expose publiquement) ===
# Listen sans ServerName = catch-all. Utilise par le HEALTHCHECK du Dockerfile.
# Sert un fichier statique healthz.txt (body = "OK\n") au lieu d'un
# RewriteRule [R=200] qui declenchait le template ErrorDocument generique
# et faisait apparaitre la mention "internal error" dans le body d'un 200.
# Le fichier vit dans /usr/local/apache2/htdocs/ (chemin Apache natif, jamais
# bind-monte) et non dans /var/www/html/ qui est ecrase par le bind-mount
# ./src au runtime.
<VirtualHost *:80>
    DocumentRoot "/usr/local/apache2/htdocs"

    Alias /healthz /usr/local/apache2/htdocs/healthz.txt

    <Directory "/usr/local/apache2/htdocs">
        Require all granted
    </Directory>

    <Files "healthz.txt">
        # Pas de cache : la sonde doit toujours toucher Apache.
        Header set Cache-Control "no-store"
    </Files>
</VirtualHost>

# === Borne client (Bloc 1 - front vanilla HTML/CSS/JS) ===
<VirtualHost *:80>
    # Hostname injecte par la var d'env APP_HOST_KIOSK au runtime.
    ServerName ${APP_HOST_KIOSK}

    DocumentRoot "/var/www/html/public/borne"

    # === Images deposees depuis le back-office ===
    # /var/www/html/public/uploads est VOISIN des deux racines web, jamais inclus
    # dedans : sans cet alias, rien de ce qui y est depose n'est atteignable. On
    # l'ouvre donc explicitement, en lecture seule, et on coupe toute possibilite
    # d'interpretation : SetHandler none rend le dossier purement statique, et le
    # FilesMatch refuse les extensions executables meme si un fichier arrivait la
    # par un autre chemin que l'envoi controle (qui, lui, ne genere que des noms
    # en 32 caracteres hexadecimaux suivis d'une extension image).
    # L'alias est declare dans LES DEUX vhosts pour que chaque site serve ses
    # images depuis SA PROPRE origine : la borne impose img-src 'self', une image
    # servie par l'autre domaine serait bloquee par le navigateur.
    Alias /uploads "/var/www/html/public/uploads"
    <Directory "/var/www/html/public/uploads">
        Options -Indexes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all granted

        SetHandler none
        RemoveHandler .php .phtml .phar

        <FilesMatch "\.(?i:php|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Confiance aux headers X-Forwarded-* de Traefik : l'IP client REELLE
    # transite par X-Forwarded-For et est lue cote PHP (App\Core\Request::
    # clientIp()). Corrige au contre-audit du 30/09 (D-7) : cette meme phrase
    # affirmait auparavant que X-Forwarded-For "est loggue dans combined" --
    # FAUX, ce format (LogFormat "combined", httpd.conf) ne comporte aucun champ
    # %{X-Forwarded-For}i. En l'etat, %h journalise l'adresse du PEER TCP
    # immediat, c'est-a-dire Traefik, jamais le client reel ; seule la couche
    # applicative (PHP, via ce header) connait la vraie IP. mod_remoteip
    # pourrait etre active pour restaurer cette IP DANS LE JOURNAL (%h) lui-meme.
    <Directory "/var/www/html/public/borne">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA-like fallback : toute URL non-fichier -> index.html
        # (pour permettre de bookmarker un chemin profond dans la borne).
        # Exclusion /api/ : ces requetes sont relayees a l'API (cf. <Location /api>
        # plus bas) et ne doivent JAMAIS retomber sur index.html.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]
    </Directory>

    # Securite supplementaire : expose uniquement public/borne, pas la racine.
    <Directory "/var/www/html/public/borne/..">
        Require all denied
    </Directory>

    # === API en MEME origine (P4 - passerelle same-origin) ===
    # La borne consomme l'API publique (/api/*) sur SA PROPRE origine : ce vhost
    # relaie ces requetes au front controller admin via PHP-FPM. data.js garde
    # donc ses URLs relatives (/api/categories...) -> aucune requete cross-origin
    # cote borne -> CORS inutile pour ce parcours (le middleware reste en place
    # cote API comme defense en profondeur). SEUL /api est relaye : le back-office
    # (/login, /admin/*) n'est PAS joignable depuis l'origine borne.
    #
    # Le chemin apres host:port dans l'URL fcgi EST le SCRIPT_FILENAME envoye a
    # FPM : on le force sur le front controller admin (un .php REEL). Sans ca, FPM
    # recevrait un chemin sous le docroot borne sans extension .php et rejetterait
    # (security.limit_extensions par defaut = .php -> reponse "Access denied").
    # ProxyPassMatch intercepte des la phase translate -> le faux chemin
    # /.../borne/api/... n'est jamais calcule. REQUEST_URI (=/api/categories) et la
    # query string sont preserves -> le Router (qui lit REQUEST_URI) route correctement.
    ProxyPassMatch "^/api(/.*)?$" "fcgi://wakdo-app:9000/var/www/html/public/admin/index.php"
    # mod_proxy_fcgi derive un SCRIPT_FILENAME corrompu (prefixe proxy: + chemin
    # original colle apres index.php) -> FPM rejette (extension != .php). On force
    # la valeur sur le front controller admin (un .php REEL) ; REQUEST_URI reste
    # intact, donc le Router route correctement.
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/var/www/html/public/admin/index.php"

    # Compression text/html, css, js, json (Cr 1.e.8 temps de chargement).
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript \
            application/javascript application/json image/svg+xml
    </IfModule>

    # Politique de cache navigateur (duree selon la presence du marqueur de
    # version dans l'adresse). Fichier unique partage avec le vhost admin :
    # la regle est ecrite une fois, incluse deux fois.
    Include conf/extra/wakdo-cache.conf

    # Borne : pas de code PHP execute cote kiosk (Bloc 1 = front only).
    # Si une requete *.php arrive ici, on la refuse pour forcer l'isolation.
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>

    # En-tetes de securite (Bloc 1). CSP STRICTE : la borne ne charge que du
    # same-origin (scripts, styles, polices, images auto-heberges, aucun CDN).
    # script-src ET style-src sans 'unsafe-inline' -> aucun handler ni style inline
    # (les replis d'image passent par un listener delegue, assets/js/img-fallback.js ;
    # le seul style inline restant a ete remplace par une classe). frame-ancestors
    # 'none' contre le clickjacking ; object-src 'none' ; base-uri 'self' borne le
    # <base href>. HSTS + nosniff en complement. Les reponses /api relayees (JSON)
    # heritent de ces headers sans effet (pas de document rendu).
    <IfModule mod_headers.c>
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        # D-7.a (revue adverse, contre-audit 30/09) : posee ICI (pas au niveau
        # serveur) depuis que le vhost admin l'exclut conditionnellement pour
        # /reset_password -- la borne, elle, ne sert jamais cette route
        # (Bloc 1, front statique), donc la valeur reste inconditionnelle.
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# === Back-office + API REST (Bloc 2 - PHP from scratch + MVC) ===
<VirtualHost *:80>
    ServerName ${APP_HOST_ADMIN}

    DocumentRoot "/var/www/html/public/admin"

    # === Images deposees depuis le back-office ===
    # /var/www/html/public/uploads est VOISIN des deux racines web, jamais inclus
    # dedans : sans cet alias, rien de ce qui y est depose n'est atteignable. On
    # l'ouvre donc explicitement, en lecture seule, et on coupe toute possibilite
    # d'interpretation : SetHandler none rend le dossier purement statique, et le
    # FilesMatch refuse les extensions executables meme si un fichier arrivait la
    # par un autre chemin que l'envoi controle (qui, lui, ne genere que des noms
    # en 32 caracteres hexadecimaux suivis d'une extension image).
    # L'alias est declare dans LES DEUX vhosts pour que chaque site serve ses
    # images depuis SA PROPRE origine : la borne impose img-src 'self', une image
    # servie par l'autre domaine serait bloquee par le navigateur.
    Alias /uploads "/var/www/html/public/uploads"
    <Directory "/var/www/html/public/uploads">
        Options -Indexes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all granted

        SetHandler none
        RemoveHandler .php .phtml .phar

        <FilesMatch "\.(?i:php|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory "/var/www/html/public/admin">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # DirectoryIndex etend a index.php pour que la racine `/` serve
        # le front controller PHP sans passer par RewriteRule (qui ne se
        # declenche pas sur un repertoire existant a cause du `!-d`).
        DirectoryIndex index.php index.html

        # Front controller MVC : toute requete non-fichier passe par index.php
        # qui dispatche via le Router (src/Core/Router.php a venir en P2).
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # Reverse FastCGI : toute requete *.php est executee par wakdo-app:9000.
    # Format proxy:fcgi://<host>:<port><path-to-proxy>
    # SetHandler s'applique au chemin courant du <FilesMatch>.
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://wakdo-app:9000"
    </FilesMatch>

    # Protection des fichiers sensibles du projet si jamais un chemin se
    # retrouve sous DocumentRoot par erreur (.env, .git, config/).
    <FilesMatch "^\.(env|git|htaccess)">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.(git|env)">
        Require all denied
    </DirectoryMatch>

    # CORS : l'API admin sous /api/* doit accepter les requetes venant
    # de la borne kiosk (APP_HOST_KIOSK). Wildcard interdit.
    # La vraie valeur vient de CORS_ALLOWED_ORIGIN dans .env, lue cote PHP.
    # Ici on pose juste les headers de prealable OPTIONS.
    <Location /api>
        <IfModule mod_headers.c>
            # Les headers definitifs sont poses par le middleware PHP.
            # Apache ne fait que relayer le preflight sans le casser.
            Header set X-Wakdo-Handled-By "apache-vhost"
        </IfModule>
    </Location>

    # Compression back-office (HTML admin + JSON API)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript \
            application/javascript application/json
    </IfModule>

    # Politique de cache navigateur, meme fichier que le vhost borne. Cote
    # back-office les adresses /assets/... portent un marqueur de version pose
    # par App\Core\Asset : elles tombent donc dans la branche "longue duree",
    # et un deploiement invalide les caches de lui-meme.
    Include conf/extra/wakdo-cache.conf

    # Securite : cookies httpOnly + secure sont forces cote PHP (voir php.ini).
    # Ici on ajoute un header CSP minimal : l'admin n'a pas besoin de charger
    # de resources externes (pas de CDN, pas d'analytics).
    # base-uri et form-action : ces deux directives ne retombent PAS sur
    # default-src (CSP niveau 3), donc doivent etre posees explicitement, comme
    # sur le vhost borne ci-dessus. Verifie avant d'ajouter form-action 'self' :
    # tous les <form> de src/app/Views postent vers un chemin relatif (grep
    # action= sur src/app/Views), donc same-origin ; aucune balise <base> n'existe
    # cote admin (contrairement a la borne), base-uri 'self' est donc un pur
    # durcissement sans effet fonctionnel.
    <IfModule mod_headers.c>
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'self'"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>

    # D-7.a (revue adverse, contre-audit 30/09) : PAS de Referrer-Policy posee
    # par Apache dans ce vhost (contrairement au vhost borne) -- elle est posee
    # cote PHP pour CHAQUE reponse dynamique (`App\Core\Response::send()`,
    # valeur par defaut "strict-origin-when-cross-origin" sauf si un controleur
    # l'a deja fixee, ex. PasswordResetController::renderConfirm() -> "no-referrer"
    # pour /reset_password). Essaye et ECARTE, tous verifies en conteneur
    # jetable : `<Location>` (ne matche jamais, la reecriture change l'URI
    # interne AVANT toute correspondance ulterieure), `Header setifempty`
    # (ajoute un SECOND en-tete au lieu de detecter celui du backend),
    # `Header ... env=` avec la variable posee par `SetEnvIf Request_URI` OU
    # par `RewriteRule [E=...]` (le `Header` ne "voit" jamais cette variable
    # comme vraie, alors que `CustomLog` -- utilise juste en dessous pour le
    # meme motif -- la voit correctement : les deux lecteurs de la meme
    # variable donnent un resultat different, cause exacte non identifiee).
    # Seules les ressources VRAIMENT statiques de ce vhost (assets/*, jamais
    # de secret dans leur propre reponse) n'ont plus cet en-tete -- sans impact
    # pratique, Referrer-Policy gouverne ce qu'ENVOIE la page qui les
    # REFERENCE, pas leur propre reponse.

    # D-7 (contre-audit 30/09) : GET /reset_password?token=<jeton brut> porte le
    # jeton de reinitialisation EN CLAIR dans sa query string
    # (PasswordResetService::requestReset()), utilisable jusqu'a sa consommation
    # ou son expiration (1h) -- le format combined journalise la ligne de
    # requete COMPLETE (%r), query string comprise, ce qui l'ecrirait dans ce
    # journal. `wakdo_no_query_log` (SetEnvIf ci-dessous) marque cette seule
    # route ; le CustomLog "combined_no_query" (httpd.conf, sans %r ni
    # %{Referer}i) prend le relais UNIQUEMENT pour elle -- la trace d'acces
    # (IP, methode, chemin, statut, taille, user-agent)
    # reste journalisee, seuls le jeton et le referer disparaissent.
    SetEnvIf Request_URI "^/reset_password" wakdo_no_query_log
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined env=!wakdo_no_query_log
    CustomLog /proc/self/fd/1 combined_no_query env=wakdo_no_query_log
</VirtualHost>
